<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolAssist - مساعد الفني الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1a2a; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #4fc3f7; margin-bottom: 5px; }
        p { color: #a0c4df; }
        .search-box { margin: 20px auto; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; height: 80px; resize: none; box-sizing: border-box; }
        button { padding: 15px; background-color: #4fc3f7; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0b1a2a; font-size: 16px; }
        button:hover { background-color: #81d4fa; }
    </style>
</head>
<body>
    <h1>CoolAssist</h1>
    <p>مساعدك الذكي في عالم التكييف والتبريد</p>

    <!-- حقل السؤال -->
    <div class="search-box">
        <textarea id="userQuestion" placeholder="اكتب سؤالك هنا (مثلاً: كود E5 في مكيف سبليت)..."></textarea>
        <button onclick="openAI()">اسأل الذكاء الاصطناعي</button>
    </div>

    <script>
        function openAI() {
            const question = document.getElementById('userQuestion').value;
            
            // إذا كتب سؤالاً، نأخذه معنا إلى جوجل جيميني، وإلا نفتح الصفحة الرئيسية
            if (question.trim() !== "") {
                // نجهز الرابط ليفتح Gemini مع السؤال
                const geminiUrl = `https://gemini.google.com/app?q=${encodeURIComponent(question)}`;
                window.open(geminiUrl, '_blank');
            } else {
                // إذا لم يكتب شيئاً، نفتح صفحة Gemini العادية
                window.open("https://gemini.google.com", '_blank');
            }
        }
    </script>
</body>
</html>
