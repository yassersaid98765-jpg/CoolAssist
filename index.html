<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolAssist - مساعد الفني الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1a2a; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #4fc3f7; margin-bottom: 5px; }
        p { color: #a0c4df; }
        .search-box { margin: 20px auto; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; height: 80px; resize: none; box-sizing: border-box; }
        button { padding: 15px; background-color: #4fc3f7; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0b1a2a; font-size: 16px; }
        button:hover { background-color: #81d4fa; }
        .response-box { margin: 20px auto; max-width: 600px; background-color: #132a43; padding: 15px; border-radius: 8px; text-align: right; white-space: pre-wrap; font-family: monospace; display: none; border-right: 4px solid #4fc3f7; }
        .loading { display: none; color: #ffca28; font-weight: bold; }
    </style>
</head>
<body>
    <h1>CoolAssist</h1>
    <p>مساعدك الذكي في عالم التكييف والتبريد (مدعوم بالذكاء الاصطناعي)</p>

    <!-- حقل السؤال -->
    <div class="search-box">
        <textarea id="userQuestion" placeholder="اكتب كود العطل (مثلاً E5) أو اشرح المشكلة (المكيف لا يبرد، الضاغط لا يعمل)..."></textarea>
        <button onclick="askAI()">اسأل الذكاء الاصطناعي</button>
    </div>

    <!-- مكان عرض الرد -->
    <div id="loadingText" class="loading">جاري التفكير والبحث عن حل... ⏳</div>
    <div id="responseBox" class="response-box"></div>

    <script>
        // هنا نضع مفتاح API الخاص بك (استبدل النص أدناه بالمفتاح الذي نسخته من Google)
        const API_KEY = "ضع_المفتاح_الخاص_بك_هنا"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        async function askAI() {
            const question = document.getElementById('userQuestion').value;
            if (!question) {
                alert("الرجاء كتابة سؤال أولاً!");
                return;
            }

            // إظهار رسالة التحميل وإخفاء الرد القديم
            document.getElementById('loadingText').style.display = 'block';
            const responseBox = document.getElementById('responseBox');
            responseBox.style.display = 'none';
            responseBox.innerText = "";

            // تجهيز الطلب
            const prompt = `أنت خبير تقني محترف في صيانة التكييف والتبريد (HVAC). أجب على سؤال الفني التالي باللغة العربية بأسلوب عملي ومباشر، واذكر الأسباب وخطوات الفحص: "${question}"`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                // إخفاء التحميل وإظهار الرد
                document.getElementById('loadingText').style.display = 'none';
                responseBox.style.display = 'block';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    responseBox.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    responseBox.innerText = "حدث خطأ في معالجة الرد. تأكد من صحة مفتاح API واتصال الإنترنت.";
                    console.log(data);
                }

            } catch (error) {
                document.getElementById('loadingText').style.display = 'none';
                responseBox.style.display = 'block';
                responseBox.innerText = "تعذر الاتصال بالخادم. تأكد من اتصالك بالإنترنت.";
            }
        }
    </script>
</body>
</html>
